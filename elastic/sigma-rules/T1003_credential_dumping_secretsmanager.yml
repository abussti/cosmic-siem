title: Credential Dumping — AWS GetSecretValue Spike
id: a1b2c3d4-0006-4e5f-8a9b-c0d1e2f30006
status: production
description: >
  Detects a burst of AWS Secrets Manager GetSecretValue API calls within a
  short window. Three or more calls in 60 seconds from the same principal
  is unusual and may indicate an attacker harvesting stored credentials,
  API keys, or database passwords from Secrets Manager.
  Mapped to MITRE ATT&CK T1003 (OS Credential Dumping).
author: Ahmad Bussti — Cosmic Info Solutions
date: 2026-05-20
modified: 2026-05-20

references:
  - https://attack.mitre.org/techniques/T1003/

tags:
  - attack.credential_access
  - attack.t1003

logsource:
  product: wazuh
  service: aws_cloudtrail

detection:
  selection:
    rule.id: '100010'
    rule.groups|contains:
      - cloudtrail
      - aws
  condition: selection | count() by agent.name >= 3

falsepositives:
  - Application startup routines that load multiple secrets at boot
  - Legitimate secrets rotation scripts running on schedule

level: high

fields:
  - agent.name
  - data.srcip
  - rule.description
  - "@timestamp"

# Elastic SIEM mapping
# Type: threshold
# Threshold field: agent.name
# Threshold count: 3
# Threshold window: 60s
# Index: logs-wazuh.alerts-*
# Query: rule.id:100010
# MITRE: T1003 — OS Credential Dumping
