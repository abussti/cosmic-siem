chain_name: credential_theft
description: >
  Credential-focused attacker path: brute-force a valid account, use it to
  authenticate normally, dump credentials from the compromised host, then
  establish C2 over HTTP for follow-on access.
entry_alert_technique: T1110
steps:
  - technique: T1110
    name: "Brute Force"
    mitre_tactic: "Credential Access"
  - technique: T1078
    name: "Valid Accounts"
    mitre_tactic: "Defense Evasion / Persistence"
  - technique: T1003
    name: "OS Credential Dumping"
    mitre_tactic: "Credential Access"
  - technique: T1071
    name: "Application Layer Protocol (C2 over HTTP)"
    mitre_tactic: "Command and Control"
