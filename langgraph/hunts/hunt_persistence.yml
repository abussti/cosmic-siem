hunt_name: persistence_cron_scheduled_tasks
hypothesis: >
  An attacker or compromised account creates a new cron job, scheduled task,
  or systemd timer to survive a reboot (T1053). Genuine new persistence
  mechanisms are rare day-to-day, so even one hit in 24h is worth a look.
  Day 28 field check: confirmed 0 hits in this environment because no
  cron/syscheck data has been generated yet — not a query bug. Inject a
  synthetic FIM alert on a cron path (same pattern as the Day 18 attack
  scenarios) to exercise this hunt end-to-end.
mitre_technique: T1053
time_window_hours: 24
finding_threshold: 1
escalate_if_found: true
index: "logs-wazuh.alerts-*"
elastic_query:
  size: 50
  sort:
    - "@timestamp": "desc"
  query:
    bool:
      must:
        - range:
            "@timestamp":
              gte: "now-TIME_WINDOW_HOURSh"
      should:
        - wildcard: { "syscheck.path": "*/etc/cron.d/*" }
        - wildcard: { "syscheck.path": "*/etc/crontab*" }
        - wildcard: { "syscheck.path": "*/var/spool/cron/*" }
        - wildcard: { "syscheck.path": "*/etc/systemd/system/*.timer" }
        - match_phrase: { "rule.description": "crontab" }
        - match_phrase: { "rule.description": "scheduled task" }
        - match_phrase: { "data.command": "crontab" }
        - match_phrase: { "data.command": "schtasks" }
      minimum_should_match: 1
