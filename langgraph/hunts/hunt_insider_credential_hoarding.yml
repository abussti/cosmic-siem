# Hunt 6 — Insider Threat: Credential Hoarding
#
# NOTE: unlike hunts/hunt_lateral_movement.yml etc. (Day 27/28), this file is
# NOT loaded by tools/hunt_loader.py — it has no single elastic_query clause
# because the detection needs a peer-group comparison, not one DSL query.
# It's loaded by tools/insider_threat.py's load_insider_playbook_config()
# instead. Still "hunts as data, not code" — just a different loader for a
# different shape, same principle Day 26 used to split reactive/proactive
# hunting into two engines.

hunt_name: insider_credential_hoarding
hypothesis: >
  A user is accessing credential/secrets stores (e.g. AWS GetSecretValue,
  vault/secret-manager references) far more than their peer group's average
  this week — consistent with hoarding credentials ahead of misuse or exfil,
  rather than routine job-function access.
mitre_technique: T1552
escalate_if_found: true

# peer_multiplier: user's weekly count must exceed peer_multiplier x the
# peer group's average weekly count to flag.
peer_multiplier: 5
lookback_days: 7
# min_events_no_peers: fallback flag threshold when the user has no seeded
# peers to compare against (avoids a single-event false positive when
# peer_avg would otherwise be 0).
min_events_no_peers: 3
